name: Build Windows bundle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          ./.venv-build/Scripts/python -m pip install -r requirements.txt -r requirements-build.txt
          "$PWD/.venv-build/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Validate source
        run: python -m compileall mdtoword

      - name: Build Windows bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: MDtoWORD-Windows-x64
          path: |
            dist/MDtoWORD-Windows-x64.zip
            dist/MDtoWORD-Windows-x64.zip.sha256
          if-no-files-found: error
