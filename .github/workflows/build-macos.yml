name: Build macOS bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS arm64
    # Apple Silicon runner: scripts/build_macos.sh builds for arm64 only.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate source
        run: python -m compileall -q mdtoword

      - name: Build macOS bundle
        run: ./scripts/build_macos.sh

      - name: Verify archive
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/mdtoword-macos-verify"
          rm -rf "$verify" && mkdir -p "$verify"
          # ditto, not unzip: the archive was made with ditto and carries the signature.
          ditto -x -k dist/MDtoWORD-macOS-arm64.zip "$verify"
          app="$verify/MDtoWORD.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          if [ "$expected" != "$actual" ]; then
            echo "Bundle version $actual does not match pyproject.toml $expected"
            exit 1
          fi
          (cd dist && shasum -a 256 -c MDtoWORD-macOS-arm64.zip.sha256)
          # The app must start: an import error in the frozen bundle exits at once.
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/MDtoWORD" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "MDtoWORD exited during startup"
            exit 1
          fi
          kill "$pid"
          echo "macOS bundle $actual verified"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: MDtoWORD-macOS-arm64
          path: |
            dist/MDtoWORD-macOS-arm64.zip
            dist/MDtoWORD-macOS-arm64.zip.sha256
          if-no-files-found: error

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/MDtoWORD-macOS-arm64.zip" \
            "dist/MDtoWORD-macOS-arm64.zip.sha256" \
            --clobber
